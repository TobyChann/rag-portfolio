# Production stack for the OCI VM:  docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (80/443); the backend, Postgres and Redis
# talk over the compose network. The frontend runs on Vercel and forwards
# /api/* here (see frontend/next.config.mjs).
#
# Needs a .env next to this file (compose variables, see deploy/.env.example)
# and backend/.env + backend/service-account.json (app settings).

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      # Overrides whatever backend/.env says, so the password lives in one place.
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/portfolio
      REDIS_URL: redis://redis:6379
      GOOGLE_SERVICE_ACCOUNT_PATH: /app/service-account.json
    # --proxy-headers: take the visitor's IP from X-Forwarded-For (set by
    # Vercel and Caddy) so per-IP rate limiting isn't one shared bucket.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    volumes:
      - ./backend/service-account.json:/app/service-account.json:ro
      - hf_cache:/root/.cache/huggingface    # embedding model survives rebuilds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    mem_limit: 4g

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # HTTPS certificates
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
  caddy_data:
  caddy_config:
